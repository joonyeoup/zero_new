[package]
name = "analyze-screen-tool"
version = "0.8.2"
edition = "2021"

[features]
default = ["downscale"]
# Re-encode the capture at a smaller max edge before sending to the VLM.
# Cuts base64 payload size substantially; costs a decode/encode round trip.
downscale = ["dep:image"]

[dependencies]
zeroclaw-api = { path = "../../../crates/zeroclaw-api", version = "0.8.2" }
zeroclaw-config = { path = "../../../crates/zeroclaw-config", version = "0.8.2" }

async-trait = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "fs", "time", "macros"] }
base64 = { workspace = true }

# ⚠️ SEAM: match whatever the rest of the workspace uses for HTTP.
# Check `grep -n "reqwest" crates/zeroclaw-tools/Cargo.toml`.
# Must be rustls (not native-tls) to cross-compile against musl for the TV.
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }

image = { workspace = true, optional = true }
